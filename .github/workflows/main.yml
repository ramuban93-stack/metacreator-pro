name: MetaCreator Pro - Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Get project source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install project packages
        run: npm install

      - name: Build web app
        run: npm run build --if-present

      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core

      - name: Create Capacitor configuration
        run: npx cap init "MetaCreator Pro" "com.metacreator.pro" --web-dir=dist --if-present

      - name: Create Android project
        run: npx cap add android --if-present

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
